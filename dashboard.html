<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Senior Care</title>

<style>
  body {
    margin: 0;
    font-family: Arial;
    background: #f7f7fb;
  }

  .header {
    background: #2563eb;
    color: white;
    padding: 15px;
    font-size: 22px;
    font-weight: bold;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .logout-btn {
    background: white;
    color: #2563eb;
    border: none;
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
  }

  .container {
    padding: 20px;
  }

  .card {
    background: white;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 15px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  }

  .service-btn {
    display: block;
    width: 100%;
    padding: 15px;
    margin: 8px 0;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    font-size: 18px;
    cursor: pointer;
  }

  .helper {
    border: 1px solid #ddd;
    padding: 12px;
    border-radius: 10px;
    margin-top: 10px;
  }

  .book-btn {
    margin-top: 10px;
    padding: 10px;
    background: green;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }

  .emergency {
    background: red;
    color: white;
    width: 100%;
    padding: 15px;
    font-size: 20px;
    border: none;
    border-radius: 12px;
    margin-top: 20px;
  }
</style>
</head>

<body>

<div class="header">
  Welcome User 👋
  <button class="logout-btn" onclick="logout()">Logout</button>
</div>

<div class="container">

  <!-- Services -->
  <div class="card">
    <h3>Select Service</h3>

    <button class="service-btn" onclick="loadHelpers('Hospital Help')">
      🏥 Hospital Help
    </button>

    <button class="service-btn" onclick="loadHelpers('Cooking Help')">
      🍲 Cooking Help
    </button>

    <button class="service-btn" onclick="loadHelpers('Cleaning')">
      🧹 Cleaning
    </button>

    <button class="service-btn" onclick="loadHelpers('Companion')">
      🚶 Companion
    </button>
  </div>

  <!-- Helpers List -->
  <div class="card">
    <h3>Available Helpers</h3>
    <div id="helpersList">Select a service to view helpers</div>
  </div>

  <!-- Emergency -->
  <button class="emergency" onclick="emergency()">
    🚨 Emergency Help
  </button>

</div>

<script type="module">
 import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
 import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

  const firebaseConfig = {
  apiKey: "AIzaSyAlOkhhqGknbp3_C-5R__BNqGeJjC_hA6o",
  authDomain: "elderly-care-5eaee.firebaseapp.com",
  projectId: "elderly-care-5eaee",
  storageBucket: "elderly-care-5eaee.firebasestorage.app",
  messagingSenderId: "340135035575",
  appId: "1:340135035575:web:85ac4c9cdb4cc7b7e14332"
};

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  onAuthStateChanged(auth, (user) => {
  if (!user) {
    window.location.href = "index.html";
  }
});

  // Load helpers
  window.loadHelpers = function(service) {

let helpers = [];

if (service === "Hospital Help") {
  helpers = [
    { name: "Dr. Raj", exp: "5 yrs", price: "₹500/hr" },
    { name: "Nurse Anita", exp: "4 yrs", price: "₹300/hr" }
  ];
}

else if (service === "Cooking Help") {
  helpers = [
    { name: "Chef Ramesh", exp: "6 yrs", price: "₹250/hr" },
    { name: "Sita Cook", exp: "3 yrs", price: "₹200/hr" }
  ];
}

else if (service === "Cleaning") {
  helpers = [
    { name: "Mohan", exp: "2 yrs", price: "₹150/hr" },
    { name: "Radha", exp: "3 yrs", price: "₹180/hr" }
  ];
}

else if (service === "Companion") {
  helpers = [
    { name: "Amit", exp: "2 yrs", price: "₹220/hr" },
    { name: "Priya", exp: "4 yrs", price: "₹260/hr" }
  ];
}

let html = "";

helpers.forEach(h => {
  html += `
    <div class="helper">
      <b>${h.name}</b><br>
      Experience: ${h.exp}<br>
      Price: ${h.price}<br>
      <button class="book-btn" onclick="bookService('${h.name}', '${service}')">
        Book Now
      </button>
    </div>
  `;
});

document.getElementById("helpersList").innerHTML = html;
};

  // Booking
  window.bookService = function(name, service) {
    alert(`✅ Booked ${service} with ${name}`);
  };

  // Emergency
  window.emergency = function() {
    alert("🚨 Call 108 / 112 immediately!");
  };

  // Logout
  window.logout = function() {
    signOut(auth).then(() => {
      alert("Logged out successfully");
      window.location.href = "index.html";
    });
  };
</script>

</body>
</html>
