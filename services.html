<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Care+ Services</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#f4f6fb;
}

/* Header */
.header {
  background:#2563eb;
  color:white;
  padding:15px;
  text-align:center;
  font-size:22px;
  font-weight:bold;
}

/* Container */
.container {
  padding:15px;
}

/* Cards */
.card {
  background:white;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

/* Search */
.search {
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #ddd;
}

/* Helper */
.helper {
  border:1px solid #eee;
  padding:12px;
  border-radius:10px;
  margin-top:10px;
}

/* Buttons */
button {
  padding:10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  background:#2563eb;
  color:white;
  margin-top:5px;
}

.green { background:green; }
.red { background:red; }

</style>
</head>

<body>

<div class="header">Care+ Smart Services 💙</div>

<div class="container">

  <!-- SEARCH -->
  <div class="card">
    <input type="text" class="search" placeholder="Search services..." onkeyup="searchService(this.value)">
  </div>

  <!-- CATEGORY -->
  <div class="card">
    <h3>Select Category</h3>

    <button onclick="loadData('medical')">🏥 Medical</button>
    <button onclick="loadData('shop')">🏪 Shops</button>
    <button onclick="loadData('ride')">🚕 Ride</button>
  </div>

  <!-- RESULT -->
  <div class="card">
    <h3>Results</h3>
    <div id="resultBox">Select category to see data</div>
  </div>

  <!-- MAP -->
  <div class="card">
    <h3>📍 Map</h3>
    <button onclick="getLocation()">📍 Use My Location</button>
    <iframe
      id="map"
      src="https://maps.google.com/maps?q=medical store near me&output=embed"
      width="100%" height="250" style="border-radius:10px;">
    </iframe>
  </div>

  <!-- ALARM -->
  <div class="card">
    <h3>⏰ Medicine Reminder</h3>
    <input type="time" id="alarmTime">
    <button class="green" onclick="setAlarm()">Set Reminder</button>
  </div>

  <!-- APPOINTMENTS -->
  <div class="card">
    <h3>📅 Appointments</h3>
    <input type="text" id="appt" placeholder="Doctor visit...">
    <button onclick="addAppt()">Add</button>
    <div id="apptList"></div>
  </div>

</div>

<script>

/* DATA */
const data = {
  medical: [
    {name:"LifeCare Pharmacy", info:"24x7 Open", rating:"⭐⭐⭐⭐"},
    {name:"City Med Store", info:"Near Hospital", rating:"⭐⭐⭐⭐⭐"}
  ],
  shop: [
    {name:"Fresh Mart", info:"500m away", rating:"⭐⭐⭐⭐"},
    {name:"Daily Needs", info:"Open till 10PM", rating:"⭐⭐⭐"}
  ],
  ride: [
    {name:"Auto Driver Raj", info:"Call anytime", rating:"⭐⭐⭐⭐"},
    {name:"City Taxi", info:"24x7 service", rating:"⭐⭐⭐⭐⭐"}
  ]
};

/* LOAD DATA */
function loadData(type){
  let html="";
  data[type].forEach(item=>{
    html+=`
      <div class="helper">
        <b>${item.name}</b> ${item.rating}<br>
        ${item.info}<br>
        <button onclick="action('${item.name}')">Use Service</button>
      </div>
    `;
  });

  document.getElementById("resultBox").innerHTML=html;

  // Change map
  document.getElementById("map").src =
    `https://maps.google.com/maps?q=${type} near me&output=embed`;
}

/* SEARCH */
function searchService(val){
  val=val.toLowerCase();
  const helpers=document.querySelectorAll(".helper");

  helpers.forEach(h=>{
    h.style.display = h.innerText.toLowerCase().includes(val)
      ? "block" : "none";
  });
}

/* ACTION */
function action(name){
  alert("Connecting to " + name);
}

/* ALARM */
function setAlarm(){
  const t=document.getElementById("alarmTime").value;
  if(!t) return alert("Select time");

  alert("Reminder set at "+t);

  setInterval(()=>{
    const now=new Date();
    const cur=now.getHours().toString().padStart(2,'0')+":"+
              now.getMinutes().toString().padStart(2,'0');

    if(cur===t){
      alert("💊 Time for medicine!");
    }
  },60000);
}

/* APPOINTMENT */
function addAppt(){
  const val=document.getElementById("appt").value;
  if(!val) return;

  const div=document.createElement("div");
  div.innerText="✔ "+val;

  document.getElementById("apptList").appendChild(div);
}
function getLocation() {
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition((pos) => {

      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;

      document.getElementById("map").src =
        `https://maps.google.com/maps?q=medical store near ${lat},${lon}&output=embed`;

    });
  } else {
    alert("Location not supported");
  }
}

</script>

</body>
</html>
